{% extends "layout.html" %}
{% block title %}Choose SACE Activity{% endblock %}
{% block content %}
<main class="max-w-xl mx-auto p-8">
<h1 class="text-2xl font-bold mb-6">Choose SACE Activity</h1>
<div class="flex flex-wrap gap-4">
{% for activity in activities %}
<a class="rounded bg-indigo-600 text-white px-5 py-3" data-activity="{{ activity.identifier }}" href="{{ activity.destination }}">{{ activity.name }}</a>
{% endfor %}
</div>
</main>
{% endblock %}
