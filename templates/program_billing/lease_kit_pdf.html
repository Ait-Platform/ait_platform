<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>AIT Lease Kit - review only</title>
<style>
html,body { margin:0; color:#111; font:11pt/1.4 Arial,sans-serif; }
@page { size:A4 portrait; margin:16mm 17mm; }
.kit-text-page,.kit-cover-page { width:100%; max-width:none; min-height:0; margin:0; padding:0; box-shadow:none; }
.kit-cover-page { display:block; position:relative; height:265mm; min-height:265mm; }
.kit-cover-particulars { margin-top:0; padding-top:200pt; text-align:center; }
.kit-cover-footer { position:absolute; bottom:0; right:0; padding-top:0; }
.signature-party { break-inside:avoid; border-bottom:1px solid #bbb; padding:4mm 0; }
.signature-party p { margin:2mm 0; overflow-wrap:anywhere; }
h2 { font-size:17pt; margin:0 0 4mm; } h3 { font-size:12pt; margin:5mm 0 2mm; break-after:avoid; }
.signature-line { display:inline-block; min-width:60mm; border-bottom:1px solid #555; min-height:5mm; }
.signature-metadata { font-size:10pt; margin-bottom:5mm; }
.sc-preview-clause { overflow-wrap:anywhere; } .sc-preview-clause h3 { break-after:avoid; }
.certificate-page { page:lease-certificate; }
@page lease-certificate { @top-center { content:"DRAFT - FOR REVIEW ONLY - NOT FOR SIGNATURE OR ISSUANCE"; font:7pt Arial,sans-serif; } }

.legal-utility-table{width:100%;border-collapse:collapse;white-space:normal;margin:8px 0}.legal-utility-table th,.legal-utility-table td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top}.legal-utility-table thead{display:table-header-group}
</style></head><body><div id="lease-kit-document">
{% set component_key=pdf_component %}{% include 'program_billing/lease_kit_component.html' %}
</div></body></html>
