{% extends "layout.html" %}
{% block title %}Simple Quote{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl mt-10 px-4">
  <h1 class="text-lg font-semibold text-slate-800">Pick a country</h1>

  <form method="get" action="{{ url_for('quote_bp.quote') }}">
    <select name="country" onchange="this.form.submit()">
      <option value="" {% if not country_code %}selected{% endif %}>Select your country</option>
      {% for c in countries %}
        <option value="{{ c.alpha2 }}" {% if country_code == c.alpha2 %}selected{% endif %}>
          {{ c.name }}
        </option>
      {% endfor %}
    </select>
  </form>

  {% if country_code %}
    <p class="mt-5 text-slate-700">You selected: <strong>{{ country_code }}</strong></p>

    <!-- Buy Now placeholder -->
    <form method="get" action="{{ url_for('quote_bp.buy_placeholder') }}">
      <button type="submit"
              class="mt-3 rounded bg-blue-600 px-4 py-2 text-white">
        Buy Now
      </button>
    </form>
  {% endif %}
</div>
{% endblock %}
