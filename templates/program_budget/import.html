{% extends "layout.html" %}
{% block title %}BudgetCash · Import statement{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4">
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
    <div class="h-3 bg-amber-500"></div>
    <div class="p-8">

      <!-- Row 1: Title & Action/Back Buttons -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 pb-4 border-b border-gray-100 gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 flex items-center">Import external statement</h1>
            <p class="mt-1 text-slate-600">CSV columns: ext_ref, txn_date, amount, balance, description</p>
        </div>
        <div class="flex items-center gap-3">
            <a href="{{ url_for('budget_bp.summary') }}" class="text-sm text-sky-600 hover:underline">View summary</a>
            <a href="{{ url_for('budget_bp.report_income_expense') }}" class="text-sm text-sky-700 hover:underline">Income & Expense report</a>
        </div>
      </div>

  <form class="mt-6 space-y-4"
        method="post"
        enctype="multipart/form-data"
        action="{{ url_for('budget_bp.import_statement') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input type="file" name="file" accept=".csv" required
           class="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0
                  file:text-sm file:font-medium file:bg-slate-900 file:text-white hover:file:bg-slate-800">

      <a href="{{ url_for('budget_bp.ledger') }}"
        class="w-full inline-flex items-center justify-center rounded-xl bg-sky-600 text-white px-4 py-2.5 text-sm font-medium shadow-sm hover:bg-sky-700">
        Go to ledger
      </a>                  

    <button class="w-full rounded-lg bg-sky-600 text-white py-2.5 text-sm font-medium hover:bg-sky-700">
      Import statement
    </button>
  </form>
    </div>
  </div>
</div>
{% endblock %}
