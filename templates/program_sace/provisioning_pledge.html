{% extends "layout.html" %}
{% block title %}Intellectual Property Pledge{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white rounded-xl shadow border p-8">
  <h1 class="text-2xl font-bold mb-6">Intellectual Property Pledge</h1>
  <div class="space-y-4">{% include "program_sace/reading_pledge_content.html" %}</div>
  <div class="flex justify-end mt-6">
  {% if reading_reference %}
    <a href="{{ url_for('sace_bp.provisioning_map') }}">Return to R Dashboard</a>
  {% else %}
    <form action="{{ url_for('sace_bp.provisioning_pledge') }}" method="post">
      <input type="hidden" name="journey" value="{{ provisioning_token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="px-6 py-2 bg-indigo-600 text-white rounded-lg" type="submit">I Agree &amp; Unlock</button>
    </form>
  {% endif %}
  </div>
</div>
{% endblock %}
