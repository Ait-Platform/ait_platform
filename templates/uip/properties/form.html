{% extends 'layout.html' %}
{% block title %}Property register - {{ org.name }}{% endblock %}
{% block flashes %}{% endblock %}
{% block content %}
{% include 'uip/navigation.html' %}
<div class="max-w-6xl mx-auto bg-white rounded-xl shadow border border-slate-200 overflow-hidden mb-12">
<div class="h-2 bg-indigo-600"></div><div class="p-6">
<div class="flex justify-between border-b pb-4"><h1 class="text-2xl font-bold">Property register</h1><a href="{{ url_for('uip_bp.dashboard', org_slug=org.slug) }}">Back</a></div>
<div class="flex justify-end gap-4 my-4"></div>
{% include 'partials/flash_messages.html' %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="block my-3">Reference<input class="block w-full border border-slate-300 rounded p-2" name="reference" type="text" value="{{ item.reference if item else '' }}" maxlength="50" required autofocus></label>
<label class="block my-3">Address<input class="block w-full border border-slate-300 rounded p-2" name="address" type="text" value="{{ item.address if item else '' }}" maxlength="500" required></label>
<label class="block my-3">Rates reference<input class="block w-full border border-slate-300 rounded p-2" name="rates_reference" type="text" value="{{ item.rates_reference or '' if item else '' }}" maxlength="100"></label>
<label class="block my-3">Classification<select class="block w-full border border-slate-300 rounded p-2" name="classification"><option value="residential" {% if (item.classification if item else 'residential') == 'residential' %}selected{% endif %}>Residential</option><option value="business" {% if (item.classification if item else 'residential') == 'business' %}selected{% endif %}>Business</option><option value="mixed" {% if (item.classification if item else 'residential') == 'mixed' %}selected{% endif %}>Mixed</option><option value="other" {% if (item.classification if item else 'residential') == 'other' %}selected{% endif %}>Other</option></select></label>
<label class="block my-3">Register status<select class="block w-full border border-slate-300 rounded p-2" name="is_active"><option value="true" {% if ('false' if item and not item.is_active else 'true') == 'true' %}selected{% endif %}>Active</option><option value="false" {% if ('false' if item and not item.is_active else 'true') == 'false' %}selected{% endif %}>Inactive</option></select></label>
<button class="px-4 py-2 bg-indigo-700 text-white rounded" type="submit">Save</button></form></div></div>
{% endblock %}
