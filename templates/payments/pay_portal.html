{% extends "layout.html" %}
{% block title %}Payment · AIT{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl mt-10 bg-white p-6 rounded shadow">

  <div class="flex items-center justify-between mb-4">
    <div>
      <div class="text-base font-semibold text-slate-800">Checkout</div>
      <div class="text-xs text-slate-500">
        {{ subject|default('course')|title }}
      </div>
    </div>
      <a href="{{ url_for('quote_bp.quote', subject=subject, country=country_code) }}"
        class="rounded border border-slate-300 px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50">
        ← Back
      </a>

  </div>

  <div class="rounded border border-slate-200 bg-slate-50 p-4">
    <div class="text-xs font-semibold tracking-wider text-slate-500">AMOUNT</div>
    <div class="mt-1 text-2xl font-semibold text-slate-900">{{ amount_display }}</div>
    <div class="mt-1 text-xs text-slate-500">Email: {{ email }}</div>
  </div>

  <div class="mt-6 flex items-center justify-end gap-2">
    <!--form method="get" action="{{ url_for('paddle_bp.paddle_start') }}">
      <input type="hidden" name="subject" value="{{ subject }}">
      <input type="hidden" name="country" value="{{ country_code }}">
      <button type="submit" class="inline-flex items-center rounded bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">
        Pay now
      </button>
    </form-->
    <form method="get" action="{{ url_for('paddle_bp.paddle_start') }}">
      <input type="hidden" name="subject" value="{{ subject }}">
      <input type="hidden" name="country" value="{{ country_code }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Pay now</button>
    </form>

  </div>


</div>
{% endblock %}
