        <div class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">To (Email Address)</label>
            <input type="email" name="to_email" value="{{ default_email }}" required autofocus class="bg-white border border-slate-300 text-slate-900 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 block w-full p-3 outline-none transition shadow-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Subject</label>
            <input type="text" name="subject" value="{{ default_subject }}" required class="bg-white border border-slate-300 text-slate-900 rounded-lg focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 block w-full p-3 outline-none font-medium transition shadow-sm">
          </div>

          <div class="bg-slate-50 border border-slate-200 rounded-lg p-5">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Email Body</label>
            <textarea name="body_text" required class="w-full h-64 bg-white border border-slate-300 rounded-lg p-4 text-sm font-mono text-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none transition shadow-sm">{{ default_body }}</textarea>
          </div>
        </div>
