{% extends "layout.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border overflow-hidden">
    <div class="h-2 bg-slate-700"></div>
    <div class="p-6">
        <!-- Row 1 -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">{% if question %}Edit{% else %}Add{% endif %} Question</h1>
            <a href="{{ url_for('admin_bp.manage_questions', subject=subject) }}" class="px-4 py-2 border rounded hover:bg-gray-50 text-sm">Back</a>
        </div>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Chapter</label>
                <select name="chapter_id" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" autofocus>
                    {% for chap in chapters %}
                    <option value="{{ chap.id }}" {% if question and question.chapter_id == chap.id %}selected{% endif %}>
                        Chapter {{ chap.chapter_number }}: {{ chap.title }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Question Type</label>
                <select name="question_type" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="multiple_choice" {% if question and question.question_type == 'multiple_choice' %}selected{% endif %}>Multiple Choice</option>
                    <option value="fill_blank" {% if question and question.question_type == 'fill_blank' %}selected{% endif %}>Fill in the Blank</option>
                    <option value="true_false" {% if question and question.question_type == 'true_false' %}selected{% endif %}>True/False</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Question Text</label>
                <textarea name="question" rows="3" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">{{ question.question if question else '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correct Answer</label>
                <input type="text" name="correct_answer" value="{{ question.correct_answer if question else '' }}" class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-slate-500 mt-1">For multiple choice, this should match the exact text of the correct option.</p>
            </div>

            <!-- Row 2 -->
            <div class="flex justify-end pt-4">
                <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Question</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
