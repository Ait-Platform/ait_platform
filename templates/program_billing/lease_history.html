{% extends 'program_billing/lease_workflow_base.html' %}
{% block workspace %}
<link rel="stylesheet" href="{{ url_for('static',filename='css/lease_kit.css') }}">
<section id="lease-document-actions" class="mt-5" aria-label="Email / Print">
<table class="w-full border-collapse text-left"><thead><tr><th scope="col">Document</th><th scope="col">Email</th><th scope="col">Print</th></tr></thead><tbody>
{% for document in action_documents %}<tr data-component="{{ document.key }}" data-label="{{ document.label }}" data-pdf-url="{{ document.pdf_url }}" data-email-url="{{ document.email_url }}">
<th scope="row">{{ document.label }}</th><td><button type="button" data-action="email" aria-label="Email {{ document.label }}">Email</button></td><td><button type="button" data-action="print" aria-label="Print {{ document.label }}">Print</button></td>
</tr>{% endfor %}
</tbody></table>
<p id="lease-actions-status" role="status" aria-live="polite"></p>
<form id="lease-actions-email-form" hidden class="mt-4">
<h2 id="lease-actions-email-title" class="font-semibold">Email PDF</h2>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="block">Recipient Email Address<input name="recipient" type="email" required maxlength="254" class="block w-full rounded border border-slate-300 p-2"></label>
<label class="mt-3 block">Optional message<textarea name="message" maxlength="5000" class="block w-full rounded border border-slate-300 p-2"></textarea></label>
<div class="mt-3 flex justify-end gap-2"><button type="button" id="lease-actions-email-cancel">Cancel</button><button type="submit" id="lease-actions-email-send">Send Email</button></div>
<p id="lease-actions-email-status" role="status" aria-live="polite"></p>
</form>
</section>
<script src="{{ url_for('static',filename='js/lease_document_actions.js') }}" defer></script>
{% endblock %}
