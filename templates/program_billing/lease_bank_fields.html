{% for key,label,length in [('bank_name','Bank name',100),('branch_name','Branch Name',100),('account_holder','Account holder',150),('account_number','Account number',20),('branch_code','Branch code',6)] %}<label for="bank-{{ key }}" class="mt-3 block text-sm">{{ label }}</label><input id="bank-{{ key }}" name="{{ key }}" maxlength="{{ length }}" {% if key!='branch_name' %}required{% endif %} {% if loop.first %}autofocus{% endif %} value="{{ request.form.get(key,editing.get(key,'') if editing else '') or '' }}" class="mt-2 w-full rounded border border-slate-300 p-2">{% endfor %}
<label for="bank-account-type" class="mt-3 block text-sm">Account type</label><select id="bank-account-type" name="account_type" required class="mt-2 w-full rounded border border-slate-300 p-2"><option value="">Choose</option>{% for kind in ['current','savings','transmission','other'] %}<option value="{{ kind }}" {% if request.form.get('account_type',editing.account_type if editing else '')==kind %}selected{% endif %}>{{ kind|capitalize }}</option>{% endfor %}</select>
