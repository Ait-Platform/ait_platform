{% extends 'layout.html' %}
{% block flashes %}{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8">
<div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
<div class="h-2 bg-indigo-700"></div><div class="p-6 space-y-6">
<div class="flex items-center justify-between gap-4"><h1 class="text-2xl font-bold text-slate-800">Auditor Flow</h1><a class="ml-auto border border-slate-300 rounded px-4 py-2" href="{{ url_for('sace_bp.reading_hub') }}">Back to Auditor Board</a></div>
<form method="post" class="flex flex-wrap items-center justify-end gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="certification-email" class="text-sm text-slate-700">Email address</label><input type="email" id="certification-email" name="email" value="{{ default_email }}" required autofocus class="border border-slate-300 rounded px-3 py-2"><button class="border border-slate-300 rounded px-4 py-2" name="action" value="email">Email</button></form>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="border rounded p-3">{{ message }}</p>{% endfor %}{% endwith %}
<iframe title="Reading endorsement examination certification" class="w-full border border-slate-200 rounded" style="height:1100px" sandbox srcdoc="{{ certificate_html|e }}"></iframe>
</div></div></div>
{% endblock %}
