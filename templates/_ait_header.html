{# templates/_ait_header.html #}
<table style="width: 100%; margin-bottom: 1.5rem; border-bottom: 2px solid #0033a1; padding-bottom: 1rem;" border="0" cellpadding="0" cellspacing="0">
  <tr>
    <td style="width: 150px; text-align: left; vertical-align: middle;">
      <img
        src="{{ logo_path if logo_path else (logo_b64 if logo_b64 else url_for('static', filename='branding/ait_logo.png')) }}"
        alt="AIT Logo"
        style="height: 100px; display: block;"
      >
    </td>
    <td style="text-align: right; vertical-align: middle;">
      <div style="font-size: 1.8rem; font-weight: 700; text-transform: uppercase; color: #0033a1; margin-bottom: 0.5rem;">
        Archoney Institute of Technology
      </div>
      <div style="font-size: 1rem; color: #475569; font-weight: 500;">
        Official Certification Document
      </div>
    </td>
  </tr>
</table>
