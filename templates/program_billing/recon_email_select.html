{% extends "layout.html" %}

{% block title %}Email Metro Readings{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto p-4 md:p-8">

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-teal-600 overflow-hidden">
    
    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h1 class="text-xl font-bold text-slate-800">
        Email Metro Readings
      </h1>
      <a href="{{ url_for('billing_bp.learner_dashboard') }}" class="text-sm font-semibold text-slate-500 hover:text-teal-600 transition flex items-center">
        &larr; Back to Dashboard
      </a>
    </div>

    <div class="p-6 md:p-8">
      <p class="text-sm text-slate-500 mb-6">Select a municipal account and billing period to generate the meter readings email for the municipality.</p>
      
      <form method="POST" action="{{ url_for('billing_bp.muni_recon_email') }}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
          <label for="account_number" class="block text-sm font-semibold text-slate-700 mb-1">Select Municipal Account</label>
          <select name="account_number" id="account_number" class="bg-white border border-slate-300 text-slate-900 rounded-lg focus:border-teal-500 focus:ring-1 focus:ring-teal-500 block w-full p-2.5 outline-none" required>
            <option value="">-- Select Account --</option>
            {% for acc in accounts %}
              <option value="{{ acc.account_number }}">{{ acc.account_number }} {% if acc.property_name %}({{ acc.property_name }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label for="month" class="block text-sm font-semibold text-slate-700 mb-1">Billing Period</label>
          <input type="month" name="month" id="month" value="{{ current_month }}" class="bg-white border border-slate-300 text-slate-900 rounded-lg focus:border-teal-500 focus:ring-1 focus:ring-teal-500 block w-full p-2.5 outline-none" required>
        </div>

        <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
          <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-teal-600 rounded-lg hover:bg-teal-700 transition shadow-sm w-full sm:w-auto">Generate Email</button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
