{% extends "uip/base.html" %}
{% block title %}Reception - {{ org.name }}{% endblock %}
{% block content %}
<header class="ui-page-head"><div><h1>Reception</h1><p>Log enquiries and keep current issues moving.</p></div><a class="ui-btn ui-btn-primary" href="{{ url_for('uip_bp.new_interaction', org_slug=org.slug) }}">Log interaction</a></header>
<section class="ui-card"><div class="ui-card-head"><h2>Open issues <span class="ui-badge">{{ issue_rows|length }}</span></h2><a href="{{ url_for('uip_bp.reception_page', org_slug=org.slug) }}">View all issues</a></div>{% include 'uip/issue_table.html' %}</section>
{% endblock %}
