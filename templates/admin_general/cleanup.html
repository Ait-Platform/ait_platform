{% extends "layout.html" %}
{% block content %}
<!-- Top Color Strip -->
<div class="w-full bg-red-600 h-3"></div>

<div class="p-8 bg-white shadow-md rounded-lg mt-4">
  <h2 class="text-3xl font-bold text-red-600 mb-4">Cleaner Up Hub</h2>
  <p class="text-gray-700 mb-8">
    Manage flash messages, toggle helpers/routes, and archive unused files.
  </p>

  <!-- Action Buttons aligned left/right -->
  <div class="flex justify-between mb-8">
    <!-- Left: Apply Filter (form) -->
    <form method="post" action="{{ url_for('general_bp.set_flash_filter') }}" class="flex items-center space-x-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <select id="flash_filter" name="flash_filter"
              class="form-select border-gray-300 rounded-md">
        <option value="all">Show All</option>
        <option value="success">Success Only</option>
        <option value="info">Info Only</option>
        <option value="warning">Warning Only</option>
        <option value="error">Error Only</option>
        <option value="none">Hide All</option>
      </select>
      <button type="submit"
              class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
        Apply Filter
      </button>
    </form>

    <!-- Right: View Audit Markdown -->
    <a href="{{ url_for('general_bp.audit_doc_dashboard') }}"
       class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
      View Audit Markdown
    </a>
  </div>
</div>
{% endblock %}
