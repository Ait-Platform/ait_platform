{% set price_shop = active_shop|default(shop|default(none)) %}
<nav aria-label="ProTrade" class="mt-5 mb-6 flex gap-2 border-b border-slate-200" style="display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto">
  {% if protrade_menu_active != 'dashboard' %}
  <!-- 1. Quote -->
  <a href="{{ url_for('mechanic_bp.new_quote') }}" {% if protrade_menu_active == 'quote' %}aria-current="page"{% endif %} class="pm-menu-button inline-flex items-center justify-center rounded-lg border px-4 py-3 text-sm font-semibold text-slate-900 transition hover:opacity-90" style="background-color:#eff6ff;border-color:#93c5fd;color:#0f172a;flex:1 1 0;min-width:max-content;min-height:46px;padding:10px 12px;font-size:14px;white-space:nowrap;{% if protrade_menu_active == 'quote' %}box-shadow:inset 0 -3px #475569;{% endif %}">Quote</a>

  {% endif %}

  <!-- 2. Invoice -->
  <a href="{{ url_for('mechanic_bp.job_cards_list') }}" {% if protrade_menu_active == 'jobs' or protrade_menu_active == 'invoice' %}aria-current="page"{% endif %} class="pm-menu-button inline-flex items-center justify-center rounded-lg border px-4 py-3 text-sm font-semibold text-slate-900 transition hover:opacity-90" style="background-color:#f0fdf4;border-color:#86efac;color:#0f172a;flex:1 1 0;min-width:max-content;min-height:46px;padding:10px 12px;font-size:14px;white-space:nowrap;{% if protrade_menu_active == 'jobs' or protrade_menu_active == 'invoice' %}box-shadow:inset 0 -3px #475569;{% endif %}">Invoice</a>

  <!-- 3. Price List -->
  <a href="{{ url_for('mechanic_bp.catalog_manage', shop_id=price_shop.id if price_shop else none) }}" {% if protrade_menu_active == 'catalog' or protrade_menu_active == 'price_list' %}aria-current="page"{% endif %} class="pm-menu-button inline-flex items-center justify-center rounded-lg border px-4 py-3 text-sm font-semibold text-slate-900 transition hover:opacity-90" style="background-color:#fefce8;border-color:#fcd34d;color:#0f172a;flex:1 1 0;min-width:max-content;min-height:46px;padding:10px 12px;font-size:14px;white-space:nowrap;{% if protrade_menu_active == 'catalog' or protrade_menu_active == 'price_list' %}box-shadow:inset 0 -3px #475569;{% endif %}">Price List</a>

  <!-- 4. Debtor -->
  <a href="{{ url_for('mechanic_bp.client_accounts') }}" {% if protrade_menu_active == 'debtors' or protrade_menu_active == 'debtor' %}aria-current="page"{% endif %} class="pm-menu-button inline-flex items-center justify-center rounded-lg border px-4 py-3 text-sm font-semibold text-slate-900 transition hover:opacity-90" style="background-color:#f5f3ff;border-color:#c4b5fd;color:#0f172a;flex:1 1 0;min-width:max-content;min-height:46px;padding:10px 12px;font-size:14px;white-space:nowrap;{% if protrade_menu_active == 'debtors' or protrade_menu_active == 'debtor' %}box-shadow:inset 0 -3px #475569;{% endif %}">Debtor</a>

  <!-- 5. Tokens -->
  <a href="{{ url_for('mechanic_bp.mechanic_dashboard') }}?action=tokens" onclick="if (typeof openWorkingArea === 'function') { openWorkingArea('tokens'); return false; }" {% if protrade_menu_active == 'tokens' %}aria-current="page"{% endif %} class="pm-menu-button inline-flex items-center justify-center rounded-lg border px-4 py-3 text-sm font-semibold text-slate-900 transition hover:opacity-90" style="background-color:#f0fdfa;border-color:#5eead4;color:#0f172a;flex:1 1 0;min-width:max-content;min-height:46px;padding:10px 12px;font-size:14px;white-space:nowrap;{% if protrade_menu_active == 'tokens' %}box-shadow:inset 0 -3px #475569;{% endif %}">Tokens</a>

  <!-- 6. Setup -->
  <a href="{{ url_for('mechanic_bp.mechanic_dashboard') }}?action=setup" onclick="if (typeof openWorkingArea === 'function') { openWorkingArea('setup'); return false; }" {% if protrade_menu_active == 'setup' %}aria-current="page"{% endif %} class="pm-menu-button inline-flex items-center justify-center rounded-lg border px-4 py-3 text-sm font-semibold text-slate-900 transition hover:opacity-90" style="background-color:#fff7ed;border-color:#fdba74;color:#0f172a;flex:1 1 0;min-width:max-content;min-height:46px;padding:10px 12px;font-size:14px;white-space:nowrap;{% if protrade_menu_active == 'setup' %}box-shadow:inset 0 -3px #475569;{% endif %}">Setup</a>
</nav>
