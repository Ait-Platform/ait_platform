{% extends "layout.html" %}
{% block content %}
  <div class="bg-white rounded-2xl shadow overflow-hidden max-w-xl mx-auto mt-10">
    <!-- Blue strip -->
    <div class="h-2 bg-blue-600"></div>

    <div class="p-6 text-center">
      <h1 class="text-2xl font-bold mb-4">Your trial has expired</h1>
      <p class="text-sm text-slate-600 mb-6">
        To continue using the platform, please activate your month‑to‑month subscription.
      </p>

      <form method="post" action="{{ url_for('payment_bp.checkout_review') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="enrollment_id" value="{{ enrollment.id }}">

        <!-- Buttons row -->
        <div class="flex justify-between">
          <!-- Go to Pay -->
          <button type="submit"
                  class="bg-emerald-500 text-white font-semibold text-sm py-2 px-5 rounded hover:bg-emerald-600">
            Go to Pay
          </button>

          <!-- Cancel -->
          <a href="{{ url_for('public_bp.welcome') }}"
             class="bg-indigo-200 text-indigo-700 font-semibold text-sm py-2 px-5 rounded hover:bg-indigo-300">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
