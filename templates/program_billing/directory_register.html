{% extends 'layout.html' %}{% block title %}Folders{% endblock %}{% block flashes %}{% endblock %}
{% block content %}
<div id="directory-register" class="mx-auto max-w-2xl px-4 py-10"><div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow"><div class="h-2 bg-green-500"></div><div class="p-6">
<div class="flex flex-wrap items-center justify-between gap-3"><h1 class="text-2xl font-semibold">Folders</h1><a href="{{ url_for('billing_bp.learner_dashboard') }}" class="rounded-lg bg-slate-100 px-4 py-2">Back to Property Management</a></div>
{% include 'partials/flash_messages.html' %}
<form method="GET" class="my-4"><label for="directory-property" class="mb-2 block font-semibold">Property</label><select id="directory-property" name="property_id" autofocus onchange="this.form.submit()" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2">{% for item in properties %}<option value="{{ item.id }}" {% if selected_property and item.id==selected_property.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></form>
<div class="flex justify-end"><button id="directory-select" type="button" {% if not selected_property %}disabled{% endif %} class="rounded-lg bg-green-100 px-4 py-2 font-semibold">Select Folder</button></div>
<input id="directory-input" type="file" webkitdirectory multiple hidden>
<p class="my-4 break-words">Selected folder: <strong id="directory-folder">No folder selected</strong></p>
<p id="directory-message" role="status" aria-live="polite" class="text-sm text-slate-700"></p>
</div></div></div>
<script src="{{ url_for('static',filename='js/pm_folder_name.js',v='20261120-html-folder-input') }}" defer></script>
{% endblock %}
