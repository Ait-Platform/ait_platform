{% extends "layout.html" %}

{% block content %}

<div class="max-w-4xl mx-auto py-8">

```
<div class="bg-white rounded-xl shadow p-8">

    <h1 class="text-3xl font-bold mb-6">
        {{ "Edit Option" if option else "Add Option" }}
    </h1>

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="mb-4">

            <label class="block mb-2 font-medium">
                Question
            </label>

            <select
                name="question_id"
                required
                class="w-full border rounded-lg p-3"
            >

                <option value="">
                    Select Question
                </option>

                {% for question in questions %}

                <option
                    value="{{ question.id }}"
                    {% if option and option.question_id == question.id %}
                    selected
                    {% endif %}
                >
                    Q{{ question.id }} - {{ question.question[:80] }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-4">

            <label class="block mb-2 font-medium">
                Option Text
            </label>

            <input
                type="text"
                name="option_text"
                value="{{ option.option_text if option else '' }}"
                required
                class="w-full border rounded-lg p-3"
            >

        </div>

        <div class="mb-6">

            <label class="block mb-2 font-medium">
                Sort Order
            </label>

            <input
                type="number"
                name="sort_order"
                value="{{ option.sort_order if option else 1 }}"
                class="w-full border rounded-lg p-3"
            >

        </div>

        <div class="flex justify-end gap-3">

            <a
                href="{{ url_for('admin_bp.options') }}"
                class="px-4 py-2 border rounded-lg"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
            >
                {{ "Update Option" if option else "Save Option" }}
            </button>

        </div>

    </form>

</div>
```

</div>

{% endblock %}
