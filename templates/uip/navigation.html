<nav aria-label="UIP Command Centre" class="ui-navigation">
{% for group, items in uip_nav_groups.items() %}<details class="ui-nav-group" {% if items|selectattr('active')|list %}open{% endif %}><summary>{{ group }}</summary>
{% for item in items %}<a href="{{ item.href }}" {% if item.active %}aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</details>{% endfor %}
</nav>
