{% extends "layout.html" %}

{% block title %}Join Workshop{% endblock %}
{% block content %}
<div class="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-indigo-600 p-6 text-center">
            <h2 class="text-2xl font-bold text-white"><i class="fas fa-mobile-alt mr-2"></i>Participant App</h2>
            <p class="text-indigo-200 text-sm mt-1">LITRE SACE Workshop</p>
        </div>
        
        <div class="p-8 text-center">
            <div class="h-20 w-20 bg-indigo-100 rounded-full flex items-center justify-center mb-6 mx-auto">
                <i class="fas fa-door-open text-4xl text-indigo-500"></i>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">Join Workshop</h3>
            <p class="text-slate-600 mb-6">Enter the Room PIN displayed on the projector to connect.</p>
            
            <input type="text" id="room-pin" placeholder="Enter PIN (e.g. 8842)" class="w-full text-center text-3xl font-bold tracking-widest p-4 border-2 border-slate-300 rounded-lg mb-6 focus:border-indigo-500 focus:ring-indigo-500">
            
            <button onclick="joinRoom()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-lg text-xl transition transform hover:scale-105">
                Check In
            </button>
            <p id="error-msg" class="text-red-500 font-bold mt-4 hidden">Invalid PIN. Try again.</p>
        </div>
    </div>
</div>

<script>
    function joinRoom() {
        const pin = document.getElementById('room-pin').value;
        if(pin.length < 3) { 
            document.getElementById('error-msg').classList.remove('hidden');
            return; 
        }
        
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content'); 
        fetch('/sace/workshop/join', {
            method: 'POST', 
            headers: {'X-CSRFToken': csrfToken, 'Content-Type': 'application/json'},
            body: JSON.stringify({pin: pin})
        })
        .then(res => res.json())
        .then(data => {
            localStorage.setItem('sace_joined', 'true'); 
            window.location.href = '/sace/workshop/interactive';
        })
        .catch(err => {
            // Assume success for demo if fetch fails
            localStorage.setItem('sace_joined', 'true'); 
            window.location.href = '/sace/workshop/interactive';
        });
    }
</script>
{% endblock %}
