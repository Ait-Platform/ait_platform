{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="md:flex md:items-center md:justify-between mb-8">
    <div class="flex-1 min-w-0">
      <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">Create Quote</h2>
      <p class="mt-1 text-sm text-gray-500">Shop: {{ shop.business_name }}</p>
    </div>
  </div>

  <div class="bg-white shadow overflow-hidden sm:rounded-lg">
    <form action="{{ url_for('mechanic_bp.new_quote') }}" method="POST">
      <div class="px-4 py-5 sm:p-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Customer & Vehicle Details</h3>
        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-gray-700">Customer Name</label>
            <input type="text" name="customer_name" required class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Vehicle Registration</label>
            <input type="text" name="vehicle_reg" required class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
          </div>
        </div>

        <h3 class="text-lg leading-6 font-medium text-gray-900 mt-8 mb-4">Select Parts</h3>
        <div class="border rounded-md p-4 bg-gray-50 mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Pre-populated & Learned Parts</label>
          <select name="selected_parts" multiple class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md" size="5">
            {% for part in catalog_parts %}
              <option value="{{ part.id }}">{{ part.part_name }} (R {{ part.default_price }}) - {{ part.category }}</option>
            {% endfor %}
          </select>
          <p class="mt-2 text-xs text-gray-500">Hold Ctrl (Windows) or Cmd (Mac) to select multiple parts.</p>
        </div>

        <div class="border rounded-md p-4 bg-indigo-50 border-indigo-200">
          <h4 class="text-sm font-medium text-indigo-900 mb-2">Need a part not in the list? Add it to your catalog here:</h4>
          <div class="grid grid-cols-1 gap-y-4 gap-x-4 sm:grid-cols-2">
            <div>
              <label class="block text-xs font-medium text-indigo-700">New Part Name</label>
              <input type="text" name="new_part_name" placeholder="e.g. Custom Exhaust" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-indigo-700">Price (R)</label>
              <input type="number" step="0.01" name="new_part_price" placeholder="0.00" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
            </div>
          </div>
        </div>
      </div>
      <div class="px-4 py-3 bg-gray-50 text-right sm:px-6">
        <a href="{{ url_for('mechanic_bp.mechanic_dashboard') }}" class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mr-2">
          Cancel
        </a>
        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Save Quote
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
