{% set data=items.get(field.key,{}) %}<div id="{{ field.key }}" class="mt-5 rounded-lg border border-slate-200 p-4">
<label for="input-{{ field.key }}" class="block font-semibold">{{ field.label }} <span class="text-xs font-normal">{{ field.requirement }}</span></label>
<p class="mt-1 text-xs text-slate-500">{% if field.placeholders %}{{ field.placeholder_source|default('R01') }} placeholders: {{ field.placeholders|join(' / ') }}{% endif %}</p>
{% if field.input_type=='date' %}<input type="date" id="input-{{ field.key }}" name="{{ field.key }}" value="{{ data.get('value','') }}" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2">
{% else %}<textarea id="input-{{ field.key }}" name="{{ field.key }}" rows="3" maxlength="4000" {% if loop is defined and loop.first %}autofocus{% endif %} class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2">{{ data.get('value','') }}</textarea>{% endif %}
{% if field.requirement=='Conditional' %}<label class="mt-3 block"><input type="checkbox" name="{{ field.key }}_na" {% if data.get('not_applicable') %}checked{% endif %}> Not Applicable</label><label for="reason-{{ field.key }}" class="mt-2 block text-sm">Applicability explanation</label><input id="reason-{{ field.key }}" name="{{ field.key }}_reason" maxlength="500" value="{{ data.get('reason','') }}" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2">{% endif %}
</div>
