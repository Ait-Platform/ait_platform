{% extends "layout.html" %}
{% block title %}Edit payment · BudgetCash{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4">
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
    <div class="h-3 bg-amber-500"></div>
    <div class="p-8">


      <!-- Row 1: Title & Action/Back Buttons -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 pb-4 border-b border-gray-100 gap-4">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 flex items-center">Edit payment</h1>
        <div class="flex items-center gap-3">
            <a href="{{ next_url }}" class="rounded border border-2 border-slate-400 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 px-3 py-1.5 hover:bg-slate-50 text-sm">
              ← Back
            </a>
        </div>
      </div>

  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">

    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Account</label>
      <select name="account_id" class="w-full rounded border-2 border-slate-400 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 px-3 py-2 text-sm" required autofocus>
        {% for a in accounts %}
          <option value="{{ a.id }}" {% if a.id == entry.account_id %}selected{% endif %}>
            {{ a.kind|title }} · {{ a.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Date</label>
        <input name="txn_date" type="date"
               value="{{ entry.txn_date }}"
               class="w-full rounded border border-2 border-slate-400 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 px-3 py-2 text-sm" required>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Paid</label>
        <input name="amount" inputmode="decimal"
               value="{{ amount_str }}"
               class="w-full rounded border border-2 border-slate-400 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 px-3 py-2 text-sm" required>
      </div>
    </div>

    <button class="w-full rounded bg-sky-600 text-white px-4 py-2.5 text-sm font-medium hover:bg-sky-700">
      Save changes
    </button>
  </form>

    </div>
  </div>
</div>
{% endblock %}
