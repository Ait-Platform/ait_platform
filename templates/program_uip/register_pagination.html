<div class="flex gap-4 mt-4">{% if page.has_prev %}<a href="{{ url_for(request.endpoint, org_slug=org.slug, page=page.prev_num, q=request.args.get("q", ""), status=request.args.get("status", "all")) }}">Previous</a>{% endif %}<span>Page {{ page.page }} of {{ page.pages or 1 }}</span>{% if page.has_next %}<a href="{{ url_for(request.endpoint, org_slug=org.slug, page=page.next_num, q=request.args.get("q", ""), status=request.args.get("status", "all")) }}">Next</a>{% endif %}</div>
