{% extends "layout.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border overflow-hidden">
    <div class="h-2 bg-slate-700"></div>
    <div class="p-6">
        <!-- Row 1 -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">{% if option %}Edit{% else %}Add{% endif %} Option</h1>
            <a href="{{ url_for('admin_bp.manage_options', subject=subject) }}" class="px-4 py-2 border rounded hover:bg-gray-50 text-sm">Back</a>
        </div>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Question</label>
                <select name="question_id" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" autofocus>
                    {% for q in questions %}
                    <option value="{{ q.id }}" {% if option and option.question_id == q.id %}selected{% endif %}>
                        Q{{ q.id }}: {{ q.question | truncate(50) }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Option Text</label>
                <input type="text" name="option_text" value="{{ option.option_text if option else '' }}" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Sort Order</label>
                <input type="number" name="sort_order" value="{{ option.sort_order if option else '1' }}" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Row 2 -->
            <div class="flex justify-end pt-4">
                <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Option</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
