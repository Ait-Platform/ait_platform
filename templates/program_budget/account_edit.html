{% extends "layout.html" %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4">
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
    <div class="h-3 bg-amber-500"></div>
    <div class="p-8">

      <!-- Row 1: Title & Action/Back Buttons -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 pb-4 border-b border-gray-100 gap-4">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 flex items-center">Edit account</h1>
        <div class="flex items-center gap-3">
            <a href="javascript:history.back()"
               class="rounded border border-slate-300 px-3 py-1.5 hover:bg-slate-50 text-sm">
              ← Back
            </a>
        </div>
      </div>

  <form method="post" class="space-y-4">
    <div>
      <label class="text-sm font-medium">Account name</label>
      <input disabled class="w-full bg-slate-100" value="{{ account.name }}">
    </div>

    <div>
      <label class="text-sm font-medium">Type</label>
      <select name="kind" class="w-full">
        <option value="asset" {{ 'selected' if account.kind=='asset' }}>Asset</option>
        <option value="liability" {{ 'selected' if account.kind=='liability' }}>Liability</option>
      </select>
    </div>

    <div>
      <label class="text-sm font-medium">Group</label>
      <input name="group_label" value="{{ account.group_label or '' }}" class="w-full">
    </div>

    <button class="btn btn-primary w-full">Save changes</button>
  </form>
    </div>
  </div>
</div>
{% endblock %}
