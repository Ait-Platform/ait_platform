<label class="block my-3">Effective from<input class="block w-full border border-slate-300 rounded p-2" name="valid_from" type="date" value="{{ link.valid_from if link else '' }}" required></label>
<label class="block my-3">Effective until<input class="block w-full border border-slate-300 rounded p-2" name="valid_to" type="date" value="{{ link.valid_to or '' if link else '' }}"></label>
<label class="block my-3">Evidence checked<select class="block w-full border border-slate-300 rounded p-2" name="is_verified"><option value="false" {% if ('true' if link and link.is_verified else 'false') == 'false' %}selected{% endif %}>Unverified</option><option value="true" {% if ('true' if link and link.is_verified else 'false') == 'true' %}selected{% endif %}>Verified</option></select></label>
