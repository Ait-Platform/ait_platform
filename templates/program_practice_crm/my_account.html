{% extends "layout.html" %}
{% block title %}My Account - HC CRM{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4">
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <div class="h-2 bg-indigo-600"></div>
    <div class="p-6">
      <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">My Account Settings</h1>
          <p class="text-slate-500">Update your login credentials and personal details.</p>
        </div>
        <a href="{{ url_for('practice_crm_bp.pipeline') }}" class="text-slate-500 hover:text-slate-700 font-medium px-4 py-2 border border-slate-300 rounded hover:bg-slate-50 transition">
          <i class="fas fa-arrow-left mr-2"></i>Back to Pipeline
        </a>
      </div>
      
      {% include "partials/flash_messages.html" %}

      <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Full Name</label>
          <input type="text" name="name" value="{{ current_user.name }}" required class="w-full rounded border-2 border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-4 py-2 bg-white">
        </div>
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Email Address</label>
          <input type="email" name="email" value="{{ current_user.email }}" required class="w-full rounded border-2 border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-4 py-2 bg-white">
          <p class="text-xs text-slate-500 mt-1">This is the email you use to login.</p>
        </div>
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Change Password (Optional)</label>
          <input type="password" name="password" autocomplete="new-password" placeholder="Leave blank to keep current password" class="w-full rounded border-2 border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-4 py-2 bg-white">
        </div>
        
        <div class="pt-4 border-t border-slate-100">
          <button type="submit" class="bg-indigo-600 text-white font-bold px-6 py-3 rounded shadow-sm hover:bg-indigo-700 transition">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
