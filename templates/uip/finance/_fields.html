<div class="ui-two">{% for field in fields %}<label>{{ field.label }}{% if field.options is not none %}<select name="{{ field.name }}" {% if field.required %}required{% endif %}>{% for value,label in field.options %}<option value="{{ value }}" {% if value|string == field.value|string %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% elif field.kind == 'textarea' %}<textarea name="{{ field.name }}" rows="3" {% if field.required %}required{% endif %}>{{ field.value }}</textarea>{% else %}<input type="{{ field.kind }}" name="{{ field.name }}" value="{{ field.value }}" {% if field.name == 'amount' %}inputmode="decimal"{% endif %} {% if field.required %}required{% endif %}>{% endif %}</label>{% endfor %}</div>
