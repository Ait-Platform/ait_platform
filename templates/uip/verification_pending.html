{% extends "uip/base.html" %}
{% block title %}{{ org.name }} - Verification Pending{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 mt-16 mb-16 text-center">
    <div class="w-20 h-20 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fas fa-lock text-3xl"></i>
    </div>
    
    <span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded font-bold uppercase tracking-wide mb-4 inline-block">{{ org.name }}</span>
    
    <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Access Not Verified</h1>
    <h2 class="text-xl font-bold text-slate-700 mb-6">{{ intent }}</h2>
    
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-8 text-left">
        <div class="flex items-start">
            <div class="flex-shrink-0 mt-1">
                <i class="fas fa-info-circle text-amber-500 text-xl"></i>
            </div>
            <div class="ml-4">
                <h3 class="text-lg font-bold text-slate-900">Verification Required</h3>
                <p class="mt-2 text-slate-600">{{ message }}</p>
            </div>
        </div>
    </div>
    
    <a href="{{ url_for('uip_bp.router_page', org_slug=org.slug) }}" class="ui-btn ui-btn-primary">
        &larr; Return to router
    </a>
</div>
{% endblock %}
