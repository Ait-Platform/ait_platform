{% extends "layout.html" %}
{% block title %}Setup Practice - Healthcare CRM{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="h-2 bg-slate-700"></div>
    <div class="p-8 md:p-12">
      
      <!-- Row 1: Title Left, Back Button Right -->
      <div class="flex justify-between items-start mb-8 border-b border-slate-100 pb-4">
        <div>
          <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Setup Practice</h1>
          <p class="text-slate-500">Configure your Health Practice CRM experience.</p>
        </div>
        <a href="{{ url_for('public_bp.welcome') }}" class="text-slate-500 hover:text-slate-700 font-medium px-4 py-2 border border-slate-300 rounded hover:bg-slate-50 transition">
          <i class="fas fa-arrow-left mr-2"></i>Back
        </a>
      </div>

      <form method="POST" action="{{ url_for('practice_crm_bp.setup') }}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Practice Name</label>
          <input type="text" name="name" required autofocus class="w-full rounded border-2 border-slate-300 px-4 py-3 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50" placeholder="e.g. City Health Clinic" value="{{ practice.name or '' }}">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Practice Type / Profession</label>
          <select name="practice_type" required class="w-full rounded border-2 border-slate-300 px-4 py-3 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50">
            <option value="" disabled selected>Select your profession...</option>
            <option value="General Practitioner" {% if practice and practice.practice_type == 'General Practitioner' %}selected{% endif %}>General Practitioner (GP)</option>
            <option value="Dentist" {% if practice and practice.practice_type == 'Dentist' %}selected{% endif %}>Dentist</option>
            <option value="Physiotherapist" {% if practice and practice.practice_type == 'Physiotherapist' %}selected{% endif %}>Physiotherapist</option>
            <option value="Optometrist" {% if practice and practice.practice_type == 'Optometrist' %}selected{% endif %}>Optometrist</option>
            <option value="Psychologist" {% if practice and practice.practice_type == 'Psychologist' %}selected{% endif %}>Psychologist / Psychiatrist</option>
            <option value="Dietician" {% if practice and practice.practice_type == 'Dietician' %}selected{% endif %}>Dietician / Nutritionist</option>
            <option value="Chiropractor" {% if practice and practice.practice_type == 'Chiropractor' %}selected{% endif %}>Chiropractor</option>
            <option value="Specialist" {% if practice and practice.practice_type == 'Specialist' %}selected{% endif %}>Specialist Surgeon / Physician</option>
            <option value="Other" {% if practice and practice.practice_type == 'Other' %}selected{% endif %}>Other Healthcare Provider</option>
          </select>
          <p class="text-xs text-slate-500 mt-2">This will customize the treatments and reasons for visit in your CRM pipeline.</p>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Contact Phone</label>
          <input type="text" name="phone" class="w-full rounded border-2 border-slate-300 px-4 py-3 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50" placeholder="011 234 5678" value="{{ practice.phone or '' }}">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Contact Email</label>
          <input type="email" name="email" class="w-full rounded border-2 border-slate-300 px-4 py-3 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50" placeholder="reception@cityhealth.co.za" value="{{ practice.email or '' }}">
        </div>

        <!-- Row 2: Right Aligned Buttons -->
        <div class="pt-6 border-t border-slate-100 flex justify-end">
          <button type="submit" class="bg-indigo-600 text-white font-bold py-2 px-6 rounded shadow-sm hover:bg-indigo-700 transition">
            Save and Continue
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
