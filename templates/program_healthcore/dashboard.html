{% extends "layout.html" %}
{% block content %}
<div class="max-w-6xl mx-auto mt-8">
  <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-100">
    <!-- Top Color Strip -->
    <div class="h-2 bg-teal-600 w-full"></div>
    
    <div class="p-6">
      <!-- Row 1: Title & Back Button -->
      <div class="flex justify-between items-center mb-6 pb-4 border-b">
        <h1 class="text-3xl font-bold text-gray-800">My Health Dashboard</h1>
        <a href="{{ url_for('hds_bp.dashboard') }}" class="px-4 py-2 bg-gray-200 text-gray-800 font-semibold rounded hover:bg-gray-300 transition text-sm">
          &larr; Exit
        </a>
      </div>

      <!-- Dashboard Tiles -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <!-- Laboratory -->
        <div class="bg-red-50 border border-red-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-red-300">
          <div class="text-5xl mb-4">🩸</div>
          <h3 class="text-xl font-bold text-red-900">Laboratory</h3>
        </div>
        
        <!-- Medications -->
        <div class="bg-blue-50 border border-blue-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-blue-300">
          <div class="text-5xl mb-4">💊</div>
          <h3 class="text-xl font-bold text-blue-900">Medications</h3>
        </div>

        <!-- Imaging -->
        <div class="bg-purple-50 border border-purple-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-purple-300">
          <div class="text-5xl mb-4">🧠</div>
          <h3 class="text-xl font-bold text-purple-900">Imaging</h3>
        </div>

        <!-- Timeline -->
        <div class="bg-yellow-50 border border-yellow-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-yellow-300">
          <div class="text-5xl mb-4">📅</div>
          <h3 class="text-xl font-bold text-yellow-900">Timeline</h3>
        </div>

        <!-- Vital Signs -->
        <div class="bg-pink-50 border border-pink-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-pink-300">
          <div class="text-5xl mb-4">❤️</div>
          <h3 class="text-xl font-bold text-pink-900">Vital Signs</h3>
        </div>

        <!-- Lifestyle -->
        <div class="bg-green-50 border border-green-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-green-300">
          <div class="text-5xl mb-4">🍎</div>
          <h3 class="text-xl font-bold text-green-900">Lifestyle</h3>
        </div>

        <!-- Reports -->
        <div class="bg-gray-50 border border-gray-200 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-gray-400">
          <div class="text-5xl mb-4">📄</div>
          <h3 class="text-xl font-bold text-gray-800">Reports</h3>
        </div>

        <!-- Share with Doctor -->
        <div class="bg-teal-50 border border-teal-100 p-8 rounded-xl hover:shadow-lg transition cursor-pointer flex flex-col items-center text-center hover:border-teal-300">
          <div class="text-5xl mb-4">👨‍⚕️</div>
          <h3 class="text-xl font-bold text-teal-900">Share with Doctor</h3>
        </div>
      </div>
      
      <!-- Row 2: Right aligned button (Example action for later) -->
      <div class="flex justify-end border-t pt-4">
        <button class="px-6 py-2 bg-gray-100 text-gray-700 font-bold rounded-lg hover:bg-gray-200 transition shadow-sm border border-gray-300">
          Dashboard Settings
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
