{% extends "program_sace_home/frame.html" %}
{% block actions %}
<div class="flex flex-wrap justify-end items-center gap-3">
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button class="inline-block px-4 py-2 rounded-lg border bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100" name="action" value="email">Email certification to myself</button></form>
<form method="post" action="{{ url_for('home_sace_bp.completion', assignment_id=row.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="home-button">Exit endorsement examination</button></form>
</div>
{% endblock %}
{% block home_content %}
<iframe title="HOME endorsement examination certification" class="w-full border border-slate-200 rounded" style="height: 1100px" sandbox srcdoc="{{ certificate_html|e }}"></iframe>
{% endblock %}
