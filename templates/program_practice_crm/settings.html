{% extends "layout.html" %}
{% block title %}Practice Settings | Practice CRM{% endblock %}

{% block content %}
<div class="mx-auto max-w-4xl mb-8">
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <div class="h-2 bg-teal-600"></div>
    <div class="p-6">
      
      <!-- Top Row: Title and Back -->
      <div class="flex items-start justify-between mb-6 border-b pb-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Practice Settings</h1>
          <p class="text-sm text-slate-500 mt-1">Update your practice's contact information and biodata.</p>
        </div>
        <a href="{{ url_for('practice_crm_bp.dashboard') }}" class="px-4 py-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 transition text-sm">Back</a>
      </div>

      {% include "partials/flash_messages.html" %}

      <div class="mt-4 max-w-2xl">
        <form method="POST" action="{{ url_for('practice_crm_bp.practice_settings') }}">
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Practice Name</label>
            <input type="text" name="name" value="{{ practice.name or '' }}" required autofocus class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2">
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Practice Email</label>
            <input type="email" name="email" value="{{ practice.email or '' }}" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2">
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Practice Phone Number</label>
            <input type="text" name="phone" value="{{ practice.phone or '' }}" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2">
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Physical Address</label>
            <textarea name="address" rows="3" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2">{{ practice.address or '' }}</textarea>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Dentist Details</label>
            <textarea name="dentist_details" rows="3" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2" placeholder="e.g. Dr. John Smith, BChD, specializing in orthodontics">{{ practice.dentist_details or '' }}</textarea>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Operating Hours</label>
            <textarea name="operating_hours" rows="3" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2" placeholder="e.g. Mon-Fri 08:00 to 17:00">{{ practice.operating_hours or '' }}</textarea>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">Appointment Slot Settings</label>
            <textarea name="slot_settings" rows="3" class="w-full border border-slate-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 px-3 py-2" placeholder="e.g. 30 minute blocks, urgent slots reserved at 16:00">{{ practice.slot_settings or '' }}</textarea>
          </div>

          <div>
            <button type="submit" class="px-6 py-2 bg-teal-600 text-white rounded shadow hover:bg-teal-700 transition">Save Settings</button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
