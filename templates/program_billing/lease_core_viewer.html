{% set viewer_prefix=viewer_prefix|default('lease-kit') %}
<section id="{{ viewer_prefix }}-document" data-lease-pdf-viewer data-viewer-prefix="{{ viewer_prefix }}" data-pdf-url="{{ viewer_pdf_url|default(core_pdf_url|default(pdf_url)) }}" aria-label="{{ viewer_label|default('Core Lease') }} PDF viewer">
<div id="{{ viewer_prefix }}-toolbar" class="lease-pdf-toolbar kit-controls" role="toolbar" aria-label="PDF controls">
<div class="kit-viewer-group" role="group" aria-label="Document zoom">
<button type="button" id="{{ viewer_prefix }}-zoom-out" class="lease-pdf-zoom-out" disabled>Zoom Out</button>
<button type="button" id="{{ viewer_prefix }}-zoom-in" class="lease-pdf-zoom-in" disabled>Zoom In</button>
</div>
<div class="kit-viewer-group" role="group" aria-label="Page navigation">
<button type="button" id="{{ viewer_prefix }}-previous" class="lease-pdf-previous" disabled>Previous</button>
<label>Page <input id="{{ viewer_prefix }}-page" class="lease-pdf-page" type="number" min="1" value="1" disabled aria-label="Page number"></label>
<span id="{{ viewer_prefix }}-page-count">of 0</span>
<button type="button" id="{{ viewer_prefix }}-next" class="lease-pdf-next" disabled>Next</button>
</div>
</div>
<p id="{{ viewer_prefix }}-status" class="lease-pdf-status" role="status" aria-live="polite">Loading PDF...</p>
<div id="{{ viewer_prefix }}-viewport" class="lease-pdf-viewport" tabindex="0" aria-label="PDF page"><canvas id="{{ viewer_prefix }}-canvas" class="lease-pdf-canvas" aria-label="{{ viewer_label|default('Core Lease') }} page"></canvas></div>

</section>
