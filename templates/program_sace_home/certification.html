{% extends "program_sace_home/frame.html" %}
{% block actions %}
<div class="flex flex-wrap justify-end items-center gap-3">
<form method="post" class="flex flex-wrap justify-end items-center gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="certification-email" class="text-sm font-medium">Email address</label>
<input type="email" id="certification-email" name="email" value="{{ default_email }}" required autofocus class="border-2 border-blue-400 rounded px-3 py-2 focus:ring-2 focus:ring-blue-100 focus:border-blue-500">
<button class="inline-block px-4 py-2 rounded-lg border bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100" name="action" value="email">Email</button></form>
</div>
{% endblock %}
{% block home_content %}
<iframe title="HOME endorsement examination certification" class="w-full border border-slate-200 rounded" style="height: 1100px" sandbox srcdoc="{{ certificate_html|e }}"></iframe>
{% endblock %}
