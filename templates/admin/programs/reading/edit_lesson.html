{% extends "layout.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border overflow-hidden">
    <div class="h-2 bg-slate-700"></div>
    <div class="p-6">
        <!-- Row 1 -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">{% if lesson %}Edit{% else %}New{% endif %} Lesson</h1>
            <a href="{{ url_for('admin_bp.lessons', subject=subject) }}" class="px-4 py-2 border rounded hover:bg-gray-50 text-sm">Back</a>
        </div>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
                <input type="text" name="title" value="{{ lesson.title if lesson else '' }}" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" autofocus>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Caption</label>
                <input type="text" name="caption" value="{{ lesson.caption if lesson else '' }}" class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            {% if lesson %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Content (optional markdown/html)</label>
                <textarea name="content" rows="6" class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">{{ lesson.content if lesson else '' }}</textarea>
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Media Filename (e.g. video.mp4)</label>
                <input type="text" name="video_filename" value="{{ lesson.video_filename if lesson else '' }}" class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Row 2 -->
            <div class="flex justify-end pt-4">
                <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Lesson</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
