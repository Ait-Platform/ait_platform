<input type="hidden" name="premises_form_version" value="2">
<section id="s1-10" class="rounded-lg border border-slate-200 p-4"><h2 class="font-semibold">Property details</h2>
<label for="premises-property_name" class="mt-3 block text-sm font-semibold">Property identification / name</label>
<input id="premises-property_name" name="premises_property_name" type="text" maxlength="200" value="{{ premises_data.property_name }}" required autofocus class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2">
<div id="s1-11"><label for="premises-property_address" class="mt-3 block text-sm font-semibold">Property physical address</label>
<textarea id="premises-property_address" name="premises_property_address" rows="3" maxlength="2000" required class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2">{{ premises_data.property_address }}</textarea></div>
</section>
