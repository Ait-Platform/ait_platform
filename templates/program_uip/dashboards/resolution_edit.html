{% extends "program_uip/base.html" %}
{% block title %}Edit Resolution - {{ org.name }}{% endblock %}

{% block content %}
<header class="ui-page-head flex justify-between items-start mb-8 border-b border-slate-200 pb-6">
    <div>
        <h1 class="text-3xl font-extrabold text-slate-900 mt-1">Edit Resolution</h1>
        <p class="text-sm text-slate-500 mt-2">Make adjustments before the Chairman locks it down.</p>
    </div>
    <div class="mt-1">
        <a href="{{ url_for('uip_bp.view_resolution', org_slug=org.slug, res_id=resolution.id) }}" class="ui-btn ui-btn-outline font-bold">
            &larr; Cancel
        </a>
    </div>
</header>

<div class="ui-card bg-white border border-slate-200 shadow-sm rounded-xl p-8 max-w-4xl">
    <form method="POST" action="{{ url_for('uip_bp.edit_resolution', org_slug=org.slug, res_id=resolution.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">Resolution Title</label>
            <input type="text" name="title" value="{{ resolution.title }}" required class="w-full border-slate-300 rounded-lg px-4 py-2 focus:ring-indigo-500">
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">Resolution Text (Formal Description)</label>
            <textarea name="description" rows="12" required class="w-full border-slate-300 rounded-lg px-4 py-2 focus:ring-indigo-500 font-mono text-sm">{{ resolution.description }}</textarea>
        </div>
        
        <div class="text-right">
            <button type="submit" class="ui-btn ui-btn-primary bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded">
                <i class="fas fa-save mr-2"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
