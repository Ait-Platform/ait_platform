{% extends "layout.html" %}
{% block content %}
<div class="px-6 py-4">
  <h2 class="text-xl font-bold">Ramp Walk + Intro</h2>
  <p class="text-gray-600">Upload your Ramp Walk + Intro video for {{ show.title }}</p>

  <form method="POST" enctype="multipart/form-data" class="mt-4">
    <input type="file" name="video" accept="video/*" required>
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded mt-2">
      Upload
    </button>
  </form>
</div>
{% endblock %}
