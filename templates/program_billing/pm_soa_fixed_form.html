<form method="post" action="{{ url_for('billing_bp.pm_soa_save_fixed',property_id=property.id,tenant_id=tenant.id) }}" class="mb-6 grid gap-4 rounded-xl border border-slate-200 p-4 sm:grid-cols-2">
<h2 class="font-bold sm:col-span-2">Fixed Charges</h2>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="fixed"><input type="hidden" name="posting_key" value="{{ values.posting_key }}">
<label>Amount (ZAR)<input autofocus required type="number" inputmode="decimal" name="amount" min="0.01" max="99999999.99" step="0.01" value="{{ values.get('amount','') }}" class="block w-full rounded-lg border border-slate-300 p-2"></label>
<label>Description<input readonly value="Rent Due" class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-2"></label>
<label>Start date<input required type="date" name="start_date" value="{{ values.get('start_date','') }}" class="block w-full rounded-lg border border-slate-300 p-2"></label>
<label>End date<input required type="date" name="end_date" value="{{ values.get('end_date','') }}" class="block w-full rounded-lg border border-slate-300 p-2"></label>
<label>Monthly posting day<input required type="number" name="day_of_month" min="1" max="31" value="{{ values.get('day_of_month','1') }}" class="block w-full rounded-lg border border-slate-300 p-2"></label>
<label>Status<select required name="status" class="block w-full rounded-lg border border-slate-300 p-2">{% for value,label in [('active','Active'),('inactive','Inactive')] %}<option value="{{ value }}" {{ 'selected' if values.get('status','active')==value else '' }}>{{ label }}</option>{% endfor %}</select></label>
<p class="text-sm text-slate-600 sm:col-span-2">Monthly rent is due on the selected day, or the month's last day when shorter. Only dates within the start and end dates are charged. Inactive schedules do not post; reactivation catches up unposted due months.</p>
<div class="flex justify-end gap-3 sm:col-span-2"><a class="rounded-lg bg-slate-100 px-4 py-2" href="{{ url_for('billing_bp.pm_soa_ledger',property_id=property.id,tenant_id=tenant.id) }}">Cancel</a><button type="submit" class="rounded-lg bg-green-100 px-4 py-2">Save Fixed Charges</button></div>
</form>
