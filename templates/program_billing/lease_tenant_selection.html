{% extends 'program_billing/lease_workflow_base.html' %}
{% block workspace %}
<h2 class="mt-4 font-semibold">Select tenants for this lease</h2>
<form method="post" class="mt-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="select_tenants"><input type="hidden" name="draft_id" value="{{ lease_draft.id if lease_draft else '' }}"><input type="hidden" name="version" value="{{ lease_draft.version if lease_draft else '' }}"><input type="hidden" name="registration_token" value="{{ draft_registration_token }}">
<div class="space-y-2">{% for tenant in tenants %}<label class="flex gap-3 rounded-lg border border-slate-200 p-3"><input type="checkbox" name="tenant_ids" value="{{ tenant.id }}" {% if tenant.id|string in selected_tenant_ids %}checked{% endif %} class="mt-1"><span>{{ tenant.legal_name }}{% if tenant.tenant_reference %}<span class="block text-sm">Tenant Reference: {{ tenant.tenant_reference }}</span>{% endif %}<span class="block text-sm">{{ 'ID Number' if tenant.party_type=='natural_person' else 'Registration Number' }}: {{ tenant.identity_number }}</span>{% if tenant.party_type=='juristic_person' %}<span class="mt-1 block text-sm">Representative: {{ tenant.signatory_name or 'Not registered' }} &middot; {{ tenant.signatory_identity_number or '' }}</span>{% endif %}</span></label>{% else %}<p>No saved tenants available.</p>{% endfor %}</div>
<div class="mt-3 flex justify-end"><button type="submit" {% if not write_enabled %}disabled{% endif %} class="rounded-lg bg-blue-700 px-4 py-2 text-white disabled:opacity-50">Save Selected Tenants / Return to Part A</button></div></form>
{% endblock %}
