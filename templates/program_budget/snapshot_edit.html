{% extends "layout.html" %}
{% block flashes %}{% endblock %}
{% block title %}BudgetCash · Edit Snapshot{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col items-center py-10 px-4">
  <div class="w-full max-w-lg bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
    <div class="h-3 bg-violet-500"></div>
    <div class="p-8">
      {% include "partials/flash_messages.html" %}

      <!-- Header -->
      <div class="flex items-center justify-between mb-6 pb-2 border-b border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800">
            Edit Snapshot
        </h1>
        <a href="{{ back_url }}"
           class="rounded border border-2 border-slate-400 focus:border-violet-500 focus:ring-1 focus:ring-violet-500 px-3 py-1.5 hover:bg-slate-50 text-sm">
           ← Back
        </a>
      </div>

      <!-- Detail Info -->
      <div class="mb-6 p-4 rounded bg-slate-50 border border-slate-200">
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="text-slate-500">Account:</div>
          <div class="font-medium text-slate-900">{{ snapshot.account_name }}</div>
          <div class="text-slate-500">Date (As At):</div>
          <div class="font-medium text-slate-900">{{ snapshot.as_at }}</div>
        </div>
      </div>

      <!-- Edit Form -->
      <form method="post" action="{{ url_for('budget_bp.snapshot_edit', snapshot_id=snapshot.id, next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">Arrears</label>
          <input type="text" inputmode="decimal" name="arrears" value="{{ '%.2f'|format((snapshot.arrears_cents|int)/100) }}"
                 class="w-full rounded border border-2 border-slate-400 focus:border-violet-500 focus:ring-1 focus:ring-violet-500 px-3 py-2">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">Due</label>
          <input type="text" inputmode="decimal" name="due" value="{{ '%.2f'|format((snapshot.due_cents|int)/100) }}"
                 class="w-full rounded border border-2 border-slate-400 focus:border-violet-500 focus:ring-1 focus:ring-violet-500 px-3 py-2">
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-700 mb-1">Balance</label>
          <input type="text" inputmode="decimal" name="balance" value="{{ '%.2f'|format((snapshot.balance_cents|int)/100) }}"
                 class="w-full rounded border border-2 border-slate-400 focus:border-violet-500 focus:ring-1 focus:ring-violet-500 px-3 py-2">
        </div>

        <button type="submit" class="w-full rounded bg-violet-600 text-white px-4 py-3 font-medium hover:bg-violet-700 shadow-sm transition-colors">
          Update Snapshot
        </button>
      </form>

    </div>
  </div>
</div>
{% endblock %}
