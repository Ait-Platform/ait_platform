{% extends 'program_billing/lease_workflow_base.html' %}
{% block workspace %}
<form method="post" class="mt-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="draft_id" value="{{ lease_draft.id }}"><input type="hidden" name="document_token" value="{{ document_token }}">
<label class="block">Recipient Email Address<input type="email" name="recipient" required autofocus value="{{ recipient }}" class="mt-2 block w-full rounded border border-slate-300 p-2"></label>
<label class="mt-3 block">Optional message<textarea name="message" maxlength="5000" rows="4" class="mt-2 block w-full rounded border border-slate-300 p-2">{{ message }}</textarea></label>
<p class="mt-3">The exact selected version will be attached. Nothing is sent until Send Email is clicked.</p>
<div class="mt-4 flex justify-end gap-3"><a href="{{ url_for('billing_bp.pm_lease_management',property_id=property.id,draft_id=lease_draft.id) }}" class="rounded bg-slate-100 px-4 py-2">Cancel</a><button type="submit" class="rounded bg-orange-600 px-4 py-2 text-white">Send Email</button></div></form>
{% endblock %}
