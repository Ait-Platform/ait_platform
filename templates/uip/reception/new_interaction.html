{% extends "layout.html" %}
{% block title %}{{ org.name }} - Log Interaction{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 mt-8 mb-16">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-200">
        <div>
            <span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded font-bold uppercase tracking-wide mb-2 inline-block">Reception</span>
            <h1 class="text-3xl font-extrabold text-slate-900">Log New Interaction</h1>
        </div>
        <a href="{{ url_for('uip_bp.dashboard', org_slug=org.slug) }}" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-50 font-bold rounded-lg shadow-sm transition">
            Cancel
        </a>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <form method="POST" class="p-8">
            <!-- WHO -->
            <div class="mb-8 p-6 bg-slate-50 rounded-lg border border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 mb-4"><i class="fas fa-user mr-2 text-indigo-500"></i> WHO is reporting this?</h3>
                <label class="block text-sm font-bold text-slate-700 mb-1">Search Resident / Contact Email</label>
                <input type="email" name="resident_email" class="w-full rounded border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g. resident@manorgardens.com (Leave blank if anonymous/walk-in)">
            </div>

            <!-- WHAT -->
            <div class="mb-8 p-6 bg-slate-50 rounded-lg border border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 mb-4"><i class="fas fa-tag mr-2 text-indigo-500"></i> WHAT is it about?</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Category</label>
                        <select name="category" required class="w-full rounded border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                            <option value="">-- Select Category --</option>
                            <option value="GENERAL ENQUIRY">General Enquiry</option>
                            <option value="SERVICE ISSUE">Service Issue</option>
                            <option value="SECURITY">Security</option>
                            <option value="CLEANING">Cleaning</option>
                            <option value="MAINTENANCE">Maintenance</option>
                            <option value="MUNICIPAL SERVICE">Municipal Service</option>
                            <option value="COMMUNITY MATTER">Community Matter</option>
                            <option value="FINANCIAL">Financial</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Short Title</label>
                        <input type="text" name="title" required class="w-full rounded border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g. Broken Streetlight">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Description of what happened</label>
                    <textarea name="description" rows="4" required class="w-full rounded border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="Provide as much detail as possible..."></textarea>
                </div>
            </div>

            <!-- HOW & PRIORITY -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="p-6 bg-slate-50 rounded-lg border border-slate-100">
                    <h3 class="text-lg font-bold text-slate-900 mb-4"><i class="fas fa-satellite-dish mr-2 text-indigo-500"></i> HOW did it arrive?</h3>
                    <select name="channel" required class="w-full rounded border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="Telephone">Telephone / Call</option>
                        <option value="Reception">Walk-in / Physical Reception</option>
                        <option value="Email">Email</option>
                        <option value="Web">Web Form</option>
                        <option value="WhatsApp">WhatsApp</option>
                    </select>
                </div>
                
                <div class="p-6 bg-slate-50 rounded-lg border border-slate-100">
                    <h3 class="text-lg font-bold text-slate-900 mb-4"><i class="fas fa-exclamation-triangle mr-2 text-amber-500"></i> Priority</h3>
                    <select name="priority" required class="w-full rounded border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                        <option value="LOW">Low</option>
                        <option value="NORMAL" selected>Normal</option>
                        <option value="HIGH">High</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                <button type="button" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-bold rounded-lg shadow-sm border border-indigo-200 hover:bg-indigo-100 transition">
                    <i class="fas fa-robot mr-2"></i> AI Assist
                </button>
                <button type="submit" class="px-8 py-4 bg-green-600 hover:bg-green-700 text-white font-bold text-lg rounded-lg shadow-[0_0_15px_rgba(34,197,94,0.3)] transition">
                    CREATE INTERACTION
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
