<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="year" value="{{ overview.start.year }}"><input type="hidden" name="expected_revision" value="{{ budget_line.revision.revision if budget_line and budget_line.revision else 0 }}"><div class="ui-two"><label>Category<input name="category" value="{{ budget_line.category if budget_line else '' }}" {% if budget_line %}readonly{% endif %} required></label><label>Approved total (rand)<input name="amount" inputmode="decimal" value="{{ budget_line.approved if budget_line else '' }}" required></label><label>Approval / revision date<input type="date" name="revised_date" value="{{ today }}" required></label></div><label>Revision explanation (management detail)<textarea name="description" required></textarea></label>{% with fields=decision_fields %}{% include 'uip/finance/_fields.html' %}{% endwith %}<button type="submit">{{ 'Record revised budget' if budget_line else 'Record approved budget' }}</button></form>
