<form method="post" action="{{ registration_action|default(request.path) }}" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Full name and surname<input autofocus name="full_name" value="{{ registration_name|default('') }}" required maxlength="160" autocomplete="name"></label>
<label>SA ID number<input name="sa_id" inputmode="numeric" pattern="[0-9]{13}" minlength="13" maxlength="13" required></label>
<label>Cellphone number<input type="tel" name="cellphone" required maxlength="20" autocomplete="tel"></label>
<label>Email address<input type="email" name="email" value="{{ registration_email|default('') }}" {% if registration_email is defined %}readonly{% endif %} required maxlength="254" autocomplete="email"></label>
<label>Residential address<textarea name="address" required minlength="5" maxlength="1000" rows="3" autocomplete="street-address"></textarea></label>
<label>Current occupation (optional)<input name="occupation" maxlength="160"></label>
<p>{% if registration_self_service|default(false) %}A unique franchisee number is assigned when you complete registration.{% else %}The registration date is recorded automatically. A unique franchisee number is assigned only after Admin approval.{% endif %}</p>
<div class="franchisee-actions"><button class="franchisee-button" type="submit">Submit registration</button></div></form>
