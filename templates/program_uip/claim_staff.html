{% extends "program_uip/base_public.html" %}
{% block title %}{{ org.name }} - Claim Operations Role{% endblock %}

{% block content %}
<header class="ui-page-head">
    <div>
        <p class="ui-eyebrow">Operations Profile Setup</p>
        <h1>Claim Your Role</h1>
        <p class="ui-subtitle">Please specify your operational role so the Secretary can securely route your tasks.</p>
    </div>
</header>

<div class="max-w-2xl mx-auto mt-8 mb-16 bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
    <form method="POST" action="{{ url_for('uip_bp.verify_staff', org_slug=org.slug) }}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Operational Role</label>
            <select name="role" class="w-full border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required>
                <option value="" disabled selected>Select Role...</option>
                <option value="Precinct Manager">Precinct / Operations Manager</option>
                <option value="Receptionist">Receptionist / Administrator</option>
                <option value="Staff">Internal Staff Member</option>
                <option value="Provider">External Provider / Contractor</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Company Name (If Provider/Contractor)</label>
            <input type="text" name="company" placeholder="e.g. ABC Security, City Plumbers..." class="w-full border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>

        <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
            <a href="{{ url_for('uip_bp.router_page', org_slug=org.slug) }}" class="text-sm font-medium text-slate-500 hover:text-slate-700">Cancel</a>
            <button type="submit" class="ui-btn ui-btn-primary bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded">
                Submit Claim for Verification
            </button>
        </div>
    </form>
</div>
{% endblock %}
