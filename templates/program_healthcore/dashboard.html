{% extends "layout.html" %}
{% block content %}
<div class="max-w-6xl mx-auto mt-8">
  <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-100">
    <!-- Top Color Strip -->
    <div class="h-2 bg-teal-600 w-full"></div>
    
    <div class="p-6">
      <!-- Row 1: Title & Back Button -->
      <div class="flex justify-between items-center mb-6 pb-4 border-b">
        <h1 class="text-3xl font-bold text-gray-800">My Health Dashboard</h1>
        <a href="{{ url_for('auth_bp.bridge_dashboard') }}" class="px-4 py-2 bg-gray-200 text-gray-800 font-semibold rounded hover:bg-gray-300 transition text-sm">
          &larr; Back to Bridge
        </a>
      </div>

      <!-- Dashboard Tiles (9 Engines) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
        
        <!-- 1. Laboratory -->
        <a href="{{ url_for('healthcore_bp.laboratory_dashboard') }}" class="bg-red-50 border border-red-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-red-300">
          <div class="text-5xl mb-4">🩸</div>
          <h3 class="text-xl font-bold text-red-900">Laboratory</h3>
        </a>
        
        <!-- 2. Medication -->
        <a href="{{ url_for('healthcore_bp.medication_dashboard') }}" class="bg-blue-50 border border-blue-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-blue-300">
          <div class="text-5xl mb-4">💊</div>
          <h3 class="text-xl font-bold text-blue-900">Medication</h3>
        </a>

        <!-- 3. Nutrition -->
        <a href="{{ url_for('healthcore_bp.nutrition_dashboard') }}" class="bg-orange-50 border border-orange-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-orange-300">
          <div class="text-5xl mb-4">🥗</div>
          <h3 class="text-xl font-bold text-orange-900">Nutrition</h3>
        </a>

        <!-- 4. Imaging -->
        <a href="{{ url_for('healthcore_bp.imaging_dashboard') }}" class="bg-purple-50 border border-purple-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-purple-300">
          <div class="text-5xl mb-4">🦴</div>
          <h3 class="text-xl font-bold text-purple-900">Imaging</h3>
        </a>

        <!-- 5. Lifestyle -->
        <a href="{{ url_for('healthcore_bp.lifestyle_dashboard') }}" class="bg-green-50 border border-green-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-green-300">
          <div class="text-5xl mb-4">🏃</div>
          <h3 class="text-xl font-bold text-green-900">Lifestyle</h3>
        </a>

        <!-- 6. Timeline -->
        <a href="{{ url_for('healthcore_bp.timeline_dashboard') }}" class="bg-yellow-50 border border-yellow-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-yellow-300">
          <div class="text-5xl mb-4">📅</div>
          <h3 class="text-xl font-bold text-yellow-900">Timeline</h3>
        </a>

        <!-- 7. Risk -->
        <a href="{{ url_for('healthcore_bp.risk_dashboard') }}" class="bg-pink-50 border border-pink-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-pink-300">
          <div class="text-5xl mb-4">⚠️</div>
          <h3 class="text-xl font-bold text-pink-900">Risk</h3>
        </a>

        <!-- 8. Correlation -->
        <a href="{{ url_for('healthcore_bp.correlation_dashboard') }}" class="bg-indigo-50 border border-indigo-100 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-indigo-300">
          <div class="text-5xl mb-4">🔗</div>
          <h3 class="text-xl font-bold text-indigo-900">Correlation</h3>
        </a>

        <!-- 9. Reporting -->
        <a href="{{ url_for('healthcore_bp.reporting_dashboard') }}" class="bg-gray-50 border border-gray-200 p-8 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center hover:border-gray-400">
          <div class="text-5xl mb-4">📄</div>
          <h3 class="text-xl font-bold text-gray-800">Reporting</h3>
        </a>

      </div>
      
      <!-- Row 2: Removed Dashboard Settings per user request -->
    </div>
  </div>
</div>
{% endblock %}
