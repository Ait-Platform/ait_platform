{% extends "layout.html" %}
{% block title %}Talent Categories | Cultural Fire{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
  <h1 class="text-xl font-semibold text-slate-900">Talent Categories</h1>
  <p class="mt-2 text-sm text-slate-600">Choose from core categories or suggest your own.</p>

  <div class="mt-4 grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">
    <div class="p-3 bg-slate-100 rounded">Singing</div>
    <div class="p-3 bg-slate-100 rounded">Dance</div>
    <div class="p-3 bg-slate-100 rounded">Poetry</div>
    <div class="p-3 bg-slate-100 rounded">Comedy</div>
    <div class="p-3 bg-slate-100 rounded">Instrumental</div>
    <div class="p-3 bg-pink-100 text-pink-700 rounded">Other (Tell us your talent)</div>
  </div>

  <div class="mt-4">
    <input type="text"
           placeholder="Describe your talent (e.g. Art, DJ, Fashion, Acting...)"
           class="w-full border rounded px-3 py-2 text-sm">
  </div>
</div>
{% endblock %}
