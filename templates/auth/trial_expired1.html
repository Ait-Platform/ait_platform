{% extends "layout.html" %}
{% block content %}
<div class="max-w-2xl mx-auto mt-12 p-8 bg-white shadow rounded">
  <h1 class="text-2xl font-bold text-red-600 mb-4">
    Your trial has expired
  </h1>
  <p class="text-gray-700 mb-6">
    To continue using <span class="font-semibold">{{ subject.name }}</span>,
    you’ll need to upgrade. Don’t worry — it only takes a minute.
  </p>

  <div class="flex space-x-4">
    <!-- Checkout button -->
    <a href="{{ url_for('payment_bp.checkout_review',
                        enrollment_id=enrollment.id,
                        next=url_for(subject.start_endpoint)) }}"
      class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
      Continue to Checkout
    </a>

    <!-- Cancel / back -->
    <a href="{{ url_for('bridge_bp.bridge', subject=subject.slug) }}"
       class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
      Back to Bridge
    </a>
  </div>
</div>
{% endblock %}
